{{- $fn := include "pp.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-api
  labels: {{- include "pp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "pp.selector" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "pp.selector" (list . "api") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- include "pp.scrapeAnnotations" (list . 8000) | nindent 8 }}
    spec:
      serviceAccountName: {{ $fn }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "pp.image" (list . .Values.image.backend) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["uvicorn", "portalpilot.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          env: {{- include "pp.appEnv" . | nindent 12 }}
          ports: [{ name: http, containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          startupProbe:          # migrations run at startup (advisory-locked, so replicas can race)
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 5
            failureThreshold: 60
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-api
  labels: {{- include "pp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector: {{- include "pp.selector" (list . "api") | nindent 4 }}
  ports: [{ name: http, port: 8000, targetPort: http }]
{{- if gt (int .Values.api.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fn }}-api
  labels: {{- include "pp.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "pp.selector" (list . "api") | nindent 6 }}
{{- end }}
