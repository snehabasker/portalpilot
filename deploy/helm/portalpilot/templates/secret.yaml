{{- if not .Values.existingSecret }}
{{- $name := printf "%s-app" (include "pp.fullname" .) }}
{{- $prev := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := .Values.secrets.operatorToken }}
{{- if and (not $token) $prev }}{{- $token = index $prev.data "OPERATOR_TOKEN" | b64dec }}{{- end }}
{{- if not $token }}{{- $token = randAlphaNum 40 }}{{- end }}
{{- if and (eq .Values.vault.keyProvider "local") (not .Values.secrets.localMasterKey) }}
{{- fail "secrets.localMasterKey is required with vault.keyProvider=local (generate one: python -c \"from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())\")" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "pp.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "pp.databaseUrl" . | quote }}
  OPERATOR_TOKEN: {{ $token | quote }}
  LOCAL_MASTER_KEY: {{ .Values.secrets.localMasterKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
{{- end }}
