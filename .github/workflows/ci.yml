name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q   # unit tests + Temporal workflow tests (time-skipping server)

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm ci || npm install
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.17.1" }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - run: until curl -sf localhost:8000/api/healthz; do sleep 3; done
      - run: pip install httpx && python e2e/run_e2e.py --chaos --timeout 900
      - if: failure()
        run: docker compose logs --tail 200 worker api
